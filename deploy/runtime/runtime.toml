# agents = ["support-agent"]
# teams = ["support"]
# use_cases = ["customer-support"]
# [access_profiles.retrieval_policy]
# minimum_trust = "human-reviewed"
# allow_stale = false
# allowed_statuses = ["stable"]
# require_sources = true

[[knowledge_bases]]
id = "wiki"
path = "Wiki"
route = "/"
publish = true
mcp = true
