name: Validate demo

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Open Knowledge
        run: curl -fsSL https://openknowledge.sh/install | bash
      - name: Test example code
        run: npm test
      - name: Validate knowledge base
        run: ~/.local/bin/okn validate Wiki
      - name: Test documented search
        run: ~/.local/bin/okn search Wiki "what context affects citation validation?" --matches --limit 3
      - name: Test static export
        run: ~/.local/bin/okn export html --out site Wiki
