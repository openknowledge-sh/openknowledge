[html.theme]
name = "openknowledge-site"
stylesheet = "assets/openknowledge-site.css"

[html.site]
base_url = "https://openknowledge.sh/wiki/"

[html.source]
github_base = "https://github.com/openknowledge-sh/openknowledge/blob/main"
entry = "Wiki"

[rules]
enabled = ["project", "writing", "asd-ste100"]

[release]
branch = "main"
policy = "follow-main"
outputs = ["viewer", "mcp"]

[publish]
assets = ["assets/**", "examples/*.go", "examples/*.pdf", "examples/*.svg"]

[maintenance]
mode = "off"
agent = "codex"
delivery = "pull-request"
auto_merge = false
