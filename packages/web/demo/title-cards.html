<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#f3f4ed;font:16px -apple-system,BlinkMacSystemFont,sans-serif;height:100vh;overflow:hidden}header{height:142px;padding:28px 44px;display:flex;justify-content:space-between;align-items:center}small{color:#9edcca;text-transform:uppercase;font:12px monospace;letter-spacing:2px}h1{font-size:36px;letter-spacing:-1.4px;margin:10px 0 0;font-weight:500}.brand{font:14px monospace;color:#a3aca7}iframe{display:block;border:1px solid #31423b;border-radius:10px 10px 0 0;margin:0 28px;width:calc(100% - 56px);height:calc(100vh - 142px);background:#eef5fa}.terminal{margin:0 44px;border:1px solid #31423b;border-radius:10px;background:#0e1413;padding:28px 34px;height:calc(100vh - 190px);font:21px/1.8 monospace}.path{font-size:13px;color:#8faaa0;border-bottom:1px solid #29372f;padding-bottom:18px;margin-bottom:24px}pre{font:inherit;margin:16px 0;white-space:pre-wrap}.green{color:#a7e6bb}.muted{color:#8faaa0}.command{color:#fff}.end{display:grid;place-content:center;text-align:center;height:calc(100vh - 180px)}.end h2{font-size:62px;font-weight:500;line-height:1.13;letter-spacing:-3px}.end p{color:#9edcca;font:22px monospace}button{font:inherit}
</style></head><body><header><div><small id="chapter"></small><h1 id="title"></h1></div><div class="brand">Open Knowledge</div></header><div id="content"></div><script>
const scenes={setup:['01 / CREATE','Start with the docs you already have.'],browse:['02 / BROWSE','Your project, in one connected wiki.'],search:['03 / FIND','Find the decision. Keep the reason.'],edit:['04 / UPDATE','Review the change. Save it to your wiki.'],end:['OPEN KNOWLEDGE','']};
const scene=new URLSearchParams(location.search).get('scene')||'setup';const data=scenes[scene]||scenes.setup;document.querySelector('#chapter').textContent=data[0];document.querySelector('#title').textContent=data[1];const content=document.querySelector('#content');
if(scene==='setup') content.innerHTML='<div class="terminal"><div class="path">relay / docs</div><div class="muted">overview.md &nbsp; delivery.md &nbsp; operations.md</div><pre class="command"><span class="green">$</span> okn setup Wiki --from docs --mode copy</pre><pre>Documents       3\nValidation      <span class="green">READY</span>\nSearch index    <span class="green">READY</span> (5 hits)\nPublication     DISABLED</pre><pre class="command"><span class="green">$</span> okn view Wiki<span class="green"> ▍</span></pre></div>';
else if(scene==='end') content.innerHTML='<div class="end"><h2>Build it once.<br>Use it in your next task.</h2><p>openknowledge.sh</p></div>';
else content.innerHTML='';
</script></body></html>
