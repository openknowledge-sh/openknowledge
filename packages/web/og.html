<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Open Knowledge Landing Page OG Image</title>
    <link rel="stylesheet" href="/src/styles.css">
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        min-height: 630px;
        background: #05070b;
      }

      .og-shell {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 54px 72px;
        background:
          linear-gradient(180deg, rgba(5, 7, 11, 0.04) 0%, rgba(5, 7, 11, 0.16) 60%, rgba(5, 7, 11, 0.82) 100%),
          linear-gradient(90deg, rgba(5, 7, 11, 0.9) 0%, rgba(5, 7, 11, 0.68) 52%, rgba(5, 7, 11, 0.08) 100%),
          url("/calm-rings-hero.png") 50% 50% / cover no-repeat;
      }

      .og-brand {
        display: inline-flex;
        align-items: center;
        gap: 13px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 620;
      }

      .og-brand img {
        width: 34px;
        height: 34px;
      }

      .og-copy {
        position: absolute;
        left: 72px;
        bottom: 72px;
        width: 790px;
      }

      .og-copy h1 {
        max-width: none;
        margin: 0;
        font-size: 68px;
        font-weight: 540;
        letter-spacing: -0.04em;
        line-height: 0.93;
        text-wrap: balance;
      }

      .og-copy p {
        max-width: 620px;
        margin: 30px 0 0;
        color: var(--muted);
        font-size: 22px;
        line-height: 1.52;
      }
    </style>
  </head>
  <body>
    <main class="og-shell">
      <div class="og-brand">
        <img src="/logo-mark.png" alt="">
        <span>Open Knowledge CLI</span>
      </div>

      <section class="og-copy">
        <h1>Build a knowledge base<br>for people and AI agents.</h1>
        <p>Keep your knowledge in Markdown. Open Knowledge makes it easy to validate, search, and share.</p>
      </section>
    </main>
  </body>
</html>
