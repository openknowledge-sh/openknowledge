type: openknowledge.eval
version: 1
id: repository-docs
defaults:
  budget: 2400
  limit: 12
cases:
  - id: eval-regressions
    question: How do I compare knowledge eval results with a Git base and gate regressions?
    agents: [docs-review-agent, knowledge-maintenance-agent]
    expect:
      sources: [features/commands/eval.md]
      evidence_contains: ["--base", regressions]
      minimum_trust: unverified
      allow_stale: false
      allowed_statuses: [stable]
  - id: deterministic-jobs
    question: How do deterministic maintenance jobs run verification in isolated worktrees?
    agents: [knowledge-maintenance-agent, runtime-operator-agent]
    expect:
      sources: [features/commands/jobs.md]
      evidence_contains: [verification, worktree]
      minimum_trust: unverified
      allow_stale: false
      allowed_statuses: [stable]
